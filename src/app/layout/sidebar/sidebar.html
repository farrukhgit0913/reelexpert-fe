<aside class="sidebar">
  <a
    class="brand"
    routerLink="/dashboard"
    (click)="navigate.emit()">
    <span class="brand-icon">R</span>
    <span>ReelExpert <strong>AI</strong></span>
  </a>

  <p class="section-label">WORKSPACE</p>

  <nav class="navigation">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="navigate.emit()">
      <span class="nav-icon">⌂</span>
      <span>Dashboard</span>
    </a>

    <a
      routerLink="/create"
      routerLinkActive="active"
      (click)="navigate.emit()">
      <span class="nav-icon">✦</span>
      <span>Create Reel</span>
    </a>

    <a
      routerLink="/reels"
      routerLinkActive="active"
      (click)="navigate.emit()">
      <span class="nav-icon">▣</span>
      <span>My Reels</span>
    </a>

    <a
      routerLink="/analytics"
      routerLinkActive="active"
      (click)="navigate.emit()">
      <span class="nav-icon">▥</span>
      <span>Analytics</span>
    </a>
  </nav>

  <p class="section-label preferences-label">PREFERENCES</p>

  <nav class="navigation">
    <a
      routerLink="/settings"
      routerLinkActive="active"
      (click)="navigate.emit()">
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="upgrade-card">
      <span class="upgrade-label">CREATE MORE</span>
      <strong>Bring your ideas to life</strong>
      <p>Turn your ideas into engaging short videos with AI.</p>
      <a routerLink="/create" (click)="navigate.emit()">Create a reel →</a>
    </div>

    <div class="profile">
      <div class="profile-avatar">FS</div>
      <div class="profile-details">
        <strong>Farrukh Shahzad</strong>
        <p>Creator account</p>
      </div>
    </div>
  </div>
</aside>
